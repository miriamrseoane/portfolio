<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Archive | Miriam R. Seoane</title>

  <link
    rel="stylesheet"
    href="https://use.typekit.net/lut7oqt.css"
  >

  <link
    rel="stylesheet"
    href="../css/style.css?v=8"
  />
</head>

<body class="archive-page">

  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="site-header">

    <div class="site-header-left">

      <a
        href="../home/"
        class="logo"
      >
        Miriam R. Seoane
      </a>

      <a
        href="../home/"
        class="archive-home-link"
      >
        Home
      </a>

    </div>

  </header>


  <!-- =========================================
       ARCHIVE
  ========================================== -->

  <main class="archive-main">

    <div class="archive-list">


      <!-- =========================================
           PROJECT 01
      ========================================== -->

      <article class="archive-project">

        <button
          class="archive-project-header"
          type="button"
          aria-expanded="false"
        >

          <span class="archive-project-title">
            Austral Intrépida Series
          </span>

          <span class="archive-project-category">
            Editorial Design
          </span>

          <span class="archive-project-year">
            2016
          </span>

        </button>


        <div class="archive-project-content">

          <div class="archive-project-inner">

            <div class="archive-gallery">

              <img
                src="../img/projects/Intrepida/01.jpg"
                alt="Austral Intrépida Series 01"
                loading="lazy"
              >

              <img
                src="../img/projects/Intrepida/02.jpg"
                alt="Austral Intrépida Series 02"
                loading="lazy"
              >

            </div>

          </div>

        </div>

      </article>


    </div>

  </main>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script src="../js/archive.js?v=1"></script>

</body>

</html>
