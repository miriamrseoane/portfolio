<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Miriam R. Seoane | Design</title>

  <link
    rel="stylesheet"
    href="../css/style.css?v=4"
  />
</head>

<body>

  <!-- HEADER -->

  <header class="site-header">

    <a
      href="../home/"
      class="logo"
    >
      Miriam R. Seoane
    </a>

    <nav>
      <a href="../about/">
        About
      </a>
    </nav>

  </header>


  <!-- HOME -->

  <main class="home">

    <div
      class="stack-gallery"
      aria-label="Selected projects"
    >

      <img
        class="gallery-image active"
        src="../img/project-01.webp"
        alt="Project 01"
        data-credit="Project 01 · 2026"
      >

      <img
        class="gallery-image"
        src="../img/project-02.webp"
        alt="Project 02"
        data-credit="Project 02 · 2026"
      >

      <img
        class="gallery-image"
        src="../img/project-03.webp"
        alt="Project 03"
        data-credit="Project 03 · 2026"
      >

    </div>

  </main>


  <!-- BOTTOM INFO -->

  <footer class="site-footer">

    <p class="gallery-credit">
      Project 01 · 2026
    </p>

    <p class="gallery-counter">
      01 / 03
    </p>

  </footer>


  <!-- JAVASCRIPT -->

  <script src="../js/slider.js?v=4"></script>

</body>

</html>
